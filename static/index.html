<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webex Voicemail Manager</title>
    <meta name="description" content="Record and upload your Webex Voicemail Greeting with automated disclaimer processing.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <h1>Voicemail Studio</h1>
            <p>Record your personal greeting. The legal disclaimer will be appended automatically.</p>
        </header>

        <main>
            <div class="auth-section" id="authSection">
                <a href="login" class="btn btn-primary" id="loginBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    Log In to Webex
                </a>
                <p class="auth-note">Or use a static token configured in <code>config.json</code></p>
            </div>

            <div class="recorder-section">
                <div class="audio-visualizer" id="visualizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>

                <div class="controls">
                    <button class="btn btn-record" id="recordBtn">
                        <span class="record-icon"></span> Record
                    </button>
                    <button class="btn btn-stop hidden" id="stopBtn">
                        <span class="stop-icon"></span> Stop
                    </button>
                </div>
                
                <div class="playback-section hidden" id="playbackSection">
                    <h3>Review Greeting</h3>
                    <audio id="audioPlayback" controls></audio>
                    <div class="action-buttons">
                        <button class="btn btn-secondary" id="retakeBtn">Retake</button>
                        <button class="btn btn-success" id="uploadBtn">Upload to Webex</button>
                    </div>
                </div>
            </div>

            <div class="status-message hidden" id="statusMessage">
                <div class="spinner hidden" id="spinner"></div>
                <p id="statusText"></p>
            </div>
        </main>
    </div>

    <script src="static/app.js"></script>
</body>
</html>
